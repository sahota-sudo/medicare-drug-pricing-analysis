name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The SQL views run in DuckDB in-process, so the analytical layer
      # is covered without standing up a database.
      - run: PYTHONPATH=src python -m pytest

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Regenerate the findings and fail if they drift from what is
      # committed: the written output must match the code that made it.
      - run: PYTHONPATH=src python -m cms.analysis
      - run: git diff --exit-code docs/findings.md docs/data_quality.md

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cms_drug_spending
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cms -d cms_drug_spending"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build the warehouse against real PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: cms_drug_spending
          PGUSER: cms
          PGPASSWORD: cms
        run: PYTHONPATH=src python -m cms.load --reset
