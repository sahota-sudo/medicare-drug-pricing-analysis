services:
  postgres:
    image: postgres:16-alpine
    container_name: cms_drug_spending_db
    environment:
      POSTGRES_DB: cms_drug_spending
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms_drug_spending"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
